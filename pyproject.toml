[project]
name = "sp5-export"
version = "0.1.0"
license = "MIT"
description = "Read-only export of a Schichtplaner5 folder into a Dispofold dataset"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
